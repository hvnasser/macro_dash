[project]
name = "macro-dash"
version = "0.1.0"
description = "Macroeconomic & market data dashboard built with Streamlit"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "supabase>=2.3.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "bizdays>=1.0.14",
    "pyield>=0.13.0",
    "polars>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "utils", "dashboard"]

[tool.ruff]
line-length = 100
